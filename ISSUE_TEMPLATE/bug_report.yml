name: Bug Report
description: Report a bug in a ColdBrew package
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which ColdBrew package is affected?
      options:
        - core
        - interceptors
        - errors
        - log
        - tracing
        - options
        - grpcpool
        - data-builder
        - cookiecutter-coldbrew
        - Not sure / multiple packages
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: Output of `go version`
      placeholder: "go1.25.0 darwin/arm64"
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package Version
      description: The version of the ColdBrew package (check go.mod)
      placeholder: "v0.3.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (include error messages, stack traces, logs)
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any additional context, configuration, or screenshots
    validations:
      required: false
